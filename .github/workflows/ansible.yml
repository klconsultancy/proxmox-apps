name: Ansible

on:
  pull_request:
    paths:
      - "ansible/**"
      - "Makefile"
      - ".github/workflows/ansible.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "Makefile"
      - ".github/workflows/ansible.yml"

permissions:
  contents: read

jobs:
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make ansible/molecule

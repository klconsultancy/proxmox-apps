# Which Upstream files each part of this repository was derived from, at which
# commit it was last reviewed, and where it deliberately differs. App scripts
# are tracked per file, Helpers per function. See CONTEXT.md and docs/adr/0001.

upstream:
  core: https://github.com/community-scripts/core
  ProxmoxVE: https://github.com/community-scripts/ProxmoxVE

parts:
  terraform/modules/lxc:
    reviewed_at:
      core: 6db68f6a9ab2c0aeb1032d6c18892ef96955190f
    sources:
      - repo: core
        path: pve/backend.func
        functions:
          - build_container
          - create_lxc_container
    deviations:
      - what: keyctl is off by default.
        upstream: keyctl=1 on every unprivileged container, so Docker can run in it.
        why: It weakens isolation and only Docker-in-LXC needs it.
      - what: /dev/net/tun is passed through as a device.
        upstream: Raw lxc.cgroup2.devices.allow and lxc.mount.entry lines in the container config.
        why: The provider cannot write raw lxc.* lines; device passthrough is the supported equivalent.
      - what: Devices are named explicitly; a privileged container gets no USB access by itself.
        upstream: GPUs and a Coral TPU are detected on the host; a privileged container gets all devices and the USB serial nodes.
        why: Terraform declares state and does not probe the host. Blanket device access is an access decision.
      - what: Root has SSH keys only.
        upstream: An optional root password, and automatic console login without one.
        why: Access and hardening are not taken from Upstream.
      - what: The timezone is not set.
        upstream: pct -timezone.
        why: The provider has no attribute for it; it is left to configuration management.
      - what: The template is passed in by the caller.
        upstream: Finds, downloads and falls back between templates and storages interactively.
        why: Selection logic exists for the interactive flow; a caller declares the template it wants.

  terraform/apps/caddy:
    generated_by: scripts/generate_app_module.py
    reviewed_at:
      ProxmoxVE: ea59019670202b740b4bd11c03f6ab4e746cc46f
    sources:
      - repo: ProxmoxVE
        path: ct/caddy.sh
    deviations:
      - what: Debian only.
        upstream: Offers Alpine as an alternative, with smaller resource values.
        why: Only Debian is translated.
      - what: The tag `community-script` is not set.
        upstream: Every container is tagged `community-script`.
        why: The container is not created by the script.

  ansible/roles/caddy:
    built_on: maxhoesel.caddy >= 6.1.0
    reviewed_at:
      ProxmoxVE: ea59019670202b740b4bd11c03f6ab4e746cc46f
      core: 0feec7a5b9610fad882f69caf0f65e8be278d743
    sources:
      - repo: ProxmoxVE
        path: install/caddy-install.sh
      - repo: ProxmoxVE
        path: ct/caddy.sh
      - repo: core
        path: lib/system.func
        functions:
          - setup_deb822_repo
    deviations:
      - what: xcaddy is not installed.
        upstream: Offers to install Go and xcaddy, default no.
        why: Plugins are added through the collection, which downloads a build instead of compiling one.
      - what: The repository is /etc/apt/sources.list.d/caddy-stable.sources, with deb-src enabled.
        upstream: /etc/apt/sources.list.d/caddy.sources with the key in /etc/apt/keyrings/caddy.gpg, deb only.
        why: That is how the collection writes it. Same repository, same suite, same package.
      - what: python3-requests and python3-debian are installed as well.
        upstream: Not installed.
        why: The collection's modules need them on the host.
      - what: A version of the caddy package can be pinned.
        upstream: Always the newest.
        why: A deployment has to be reproducible. Without a pin the newest is installed, as Upstream does.
      - what: Updating moves the caddy package only.
        upstream: update runs apt upgrade for the whole system.
        why: Keeping the system current is not this role's job.
      - what: Debian only.
        upstream: Has an Alpine path with its own Caddyfile and OpenRC service.
        why: Only Debian is translated.
